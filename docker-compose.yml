# Production: ~/BOTS/reverseSearchBot/ on skrime-vps, next to a .env made from .env.example.
# Traefik (file provider) routes https://anybyte.org/telebot/rsbot -> rsbot:8080 with the
# /telebot/rsbot prefix stripped, so no ports are published here.
services:
  rsbot:
    build: .
    image: reverse-search-bot:latest
    container_name: rsbot
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_MODE: webhook
    networks:
      - bots-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  bots-network:
    external: true
