[project]
name = "reverse-search-bot"
version = "2.0.0"
description = "Telegram reverse image search bot backed by SauceNAO"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31",
    "cachetools>=7.2",
    "httpx>=0.28",
    "pydantic-settings>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.16",
]

[project.scripts]
reverse-search-bot = "reverse_search_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reverse_search_bot"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "ASYNC", "RET", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR2004", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["reverse_search_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
